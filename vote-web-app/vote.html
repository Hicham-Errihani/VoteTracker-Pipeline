<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Vote en direct</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h2 class="text-center text-primary mb-4">📥 Vote en direct</h2>
      <form id="voteForm">
        <div class="mb-3">
          <label for="candidate" class="form-label">👤 Nom du candidat</label>
          <select class="form-select" id="candidate" required>
            <option value="HICHAM">HICHAM</option>
            <option value="IKRAM">IKRAM</option>
            <option value="SALIH">SALIH</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="party" class="form-label">🏛️ Parti politique</label>
          <input type="text" class="form-control" id="party" readonly>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">✍️ Envoyer mon vote</button>
      </form>

      <div id="successMessage" class="alert alert-info mt-4 text-center d-none">
        ✅ Vote envoyé avec succès !
      </div>

      <div class="text-center mt-4">
        <h5>🕔 5 derniers votes</h5>
        <ul id="lastVotes" class="list-group mt-2"></ul>
      </div>
    </div>
  </div>

  <script>
    const candidates = {
      'HICHAM': 'Parti Alpha',
      'IKRAM': 'Parti Bêta',
      'SALIH': 'Parti Gamma'
    };

    const candidateInput = document.getElementById('candidate');
    const partyInput = document.getElementById('party');
    const successMessage = document.getElementById('successMessage');
    const lastVotesList = document.getElementById('lastVotes');

    candidateInput.addEventListener('change', () => {
      partyInput.value = candidates[candidateInput.value];
    });

    document.getElementById('voteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const candidate = candidateInput.value;
      const party = partyInput.value;

      await axios.post('/vote', {
        candidate: candidate,
        party: party
      });

      successMessage.classList.remove('d-none');
      setTimeout(() => successMessage.classList.add('d-none'), 3000);

      fetchLastVotes();
    });

    async function fetchLastVotes() {
      const response = await axios.get('/last-votes');
      lastVotesList.innerHTML = '';
      response.data.forEach(vote => {
        const li = document.createElement('li');
        li.className = "list-group-item";
        const time = new Date(vote.timestamp * 1000).toLocaleTimeString();
        li.textContent = `${vote.candidate} - ${vote.party} - ${time}`;
        lastVotesList.appendChild(li);
      });
    }

    // Initialisation
    partyInput.value = candidates[candidateInput.value];
    fetchLastVotes();
  </script>
</body>
</html>
