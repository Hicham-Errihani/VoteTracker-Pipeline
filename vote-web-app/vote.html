<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Voter en ligne</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
  <h2>Vote en direct</h2>
  <form id="voteForm" class="mb-3">
    <input type="text" class="form-control mb-2" id="candidate" placeholder="Nom du candidat" required>
    <input type="text" class="form-control mb-2" id="party" placeholder="Nom du parti" required>
    <button type="submit" class="btn btn-success">Envoyer le vote</button>
  </form>
  <div id="result" class="alert alert-info d-none"></div>

  <script>
    document.getElementById("voteForm").addEventListener("submit", function(e) {
      e.preventDefault();
      fetch("/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          candidate: document.getElementById("candidate").value,
          party: document.getElementById("party").value
        })
      }).then(response => response.text())
        .then(msg => {
          const resultDiv = document.getElementById("result");
          resultDiv.innerText = msg;
          resultDiv.classList.remove("d-none");
        });
    });
  </script>
</body>
</html>
